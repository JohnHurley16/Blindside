# cbindgen config for the blindside C ABI.
#
# language = "C" and cpp_compat = true: a plain C header that a C++ translation unit can
# include. Unreal is C++, but generating C++ (with enum class, namespaces, references)
# would tie the header to one compiler's ABI and make a second, non-C++ consumer -- a
# hardware backend, a Python tool, a Godot GDExtension -- awkward. C is the lowest common
# denominator and that is the point of choosing a C ABI at all.

language = "C"
cpp_compat = true
pragma_once = true
include_version = false
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 4
line_length = 96

header = """
/* GENERATED BY cbindgen FROM crates/blindside-ffi/src/lib.rs -- DO NOT EDIT.
 *
 * Regenerate with `cargo build -p blindside-ffi` (build.rs runs cbindgen).
 *
 * This file is the ENTIRE surface between the deterministic Rust simulation and any
 * engine client. Read it top to bottom and you have read the boundary.
 *
 * Note what is not here: there is no function that returns a world, a cave, an agent's
 * true position, or anything else an agent's policy is not allowed to know.
 * `blindside_sim::World` is `pub(crate)` in Rust, so the crate that generates this header
 * cannot name the type, let alone return it. That is the project's one invariant
 * (CLAUDE.md) expressed as an absence, and an absence is not something a future
 * "just for debugging" accessor can quietly work around: it would have to widen the sim's
 * own module privacy first, in a different crate, in a separate commit.
 */
"""

[export]
prefix = ""
include = ["BsStatus", "BsBeliefHeader", "BsBeliefPoint", "BsSim"]

[export.rename]
# cbindgen would otherwise emit the Rust variant names verbatim (Ok, NullHandle, ...),
# which are far too generic for a global C namespace.

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false

[defines]
